    console.log("--- Setup Complete ---");

    console.log("\n--- The OOP Foundation ---");

    class TeamMember {
      constructor(data) {
        this._id = data.id;
        this._firstName = data.firstName;
        this._lastName = data.lastName;
        this._hobbies = [...data.hobbies];
        this._favouriteFoods = [...data.favouriteFoods];
        this._pets = [...data.pets];
      }

      get fullName() {
        return `${this._lastName}, ${this._firstName}`;
      }

      hasHobby(hobby) {
        return this._hobbies.includes(hobby);
      }

      get pets() {
        return this._pets;
      }

      addPet(petName) {
        if (!this._pets.includes(petName)) {
          this._pets.push(petName);
          console.log(
            `${this._firstName} ${this._lastName} now has a new pet: ${petName}`
          );
        } else {
          console.log(
            `${this._firstName} ${this._lastName} already has a ${petName}.`
          );
        }
      }

      get summary() {
        const hobbyCount = this._hobbies.length;
        const petCount = this.pets.length;
        return `${this._firstName} ${this._lastName} has ${hobbyCount} hobbies and ${petCount} pet(s).`;
      }

      clearPetsRecursive() {
        // Base case: If the pets array is empty, stop.
        if (this.pets.length === 0) {
          console.log(`${this.firstName}'s pets array is now empty.`);
          return;
        }

        // Recursive step: Remove one pet and call the function again.
        const removedPet = this.pets.pop(); // Removes the last element
        // console.log(`Recursively removed pet: ${removedPet}`); // Optional log
        this.clearPetsRecursive(); // Recurse
      }
    }

    // Instantiate Team Members
    const teamMemberInstances = rawTeamData.map((data) => new TeamMember(data));
    console.log(`Created ${teamMemberInstances.length} TeamMember instances.`);

    // Checks
    console.log("Member 1 Full Name:", teamMemberInstances[0].fullName);
    console.log("Member 2 Summary:", teamMemberInstances[1].summary);
