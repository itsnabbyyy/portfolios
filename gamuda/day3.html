<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" , initial-scale="1.0" />
    <title>My World</title>
    <script>
      console.log("Yellow World");

      let width, length, area;
      width = 10;
      length = 20;
      area = width * length;
      console.log(area);

      let myNum = 10;
      let myStr = "Hello World";
      let flag = true;
      console.log(typeof myNum);
      console.log(typeof myStr);
      console.log(typeof flag);

      const person = {
        name: "Alice",
        age: 30,
      };

      person.age = 31;
      person.city = "New York";
      console.log(person); // {name: "Alice", age: 31, city: "New York"}

      let numArr = [3, 6, 7, 9, 10];
      let fruitArr = ["Apple", "Orange", "Grape"];

      console.log(numArr.length);
      console.log(fruitArr.length);

      console.log(numArr);
      console.log(numArr[3]);

      fruitArr[1] = "Durian";
      console.log(fruitArr[1]);

      const PI = 3.141592653589793;
      let radius = 10;
      let areaOfCircle = PI * radius ** 2;
      console.log(areaOfCircle);

      let student = {
        firstName: "Susan",
        lastName: "Lee",
        age: 19,
      };

      console.log(student.firstName);
      console.log(student["lastName"]);
      student.age = 20;
      console.log(student.age);

      let number3 = 0.3;
      let number4 = 0.1 + 0.2;
      console.log(number3 == number4);
      console.log(number3 === number4);
      console.log(number4);

      let number1 = "3";
      let number2 = 3;
      console.log(number1 === number2);
      console.log(number1 == number2);

      let teammates = [
        {
          fname: "Nabilah",
          lname: "Zieha",
          hobbies: ["Sleeping", "Hiking"],
          favfood: ["Kimchi", "Spaghetti"],
          pets: ["Loki", "Bella"],
        },
        {
          fname: "Jacob",
          lname: "John",
          hobbies: ["Sleeping", "Eating"],
          favfood: ["Pizza", "Burger"],
          pets: ["Bubu", "Gaga"],
        },
      ];

      console.log(teammates);
    </script>
  </head>
  <body>
    <h1>My First World</h1>
  </body>
</html>
